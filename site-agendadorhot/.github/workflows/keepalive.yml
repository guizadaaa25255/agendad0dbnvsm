name: Keep Render Services Awake (Staggered)

on:
  schedule:
    - cron: "*/7 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping agendador-hot on Render
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 "https://agendador-hot.onrender.com/api/health"

      - name: Ping bot-atendimento on Render
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 60 "https://bot-atendimento-kkh8.onrender.com/health"
